name: keras3-env
channels:
  - defaults
dependencies:
  - python=3.11.14
  - pip=26.1.2
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - keras==3.15.1
      - torch==2.13.0
      - transformers==5.15.1
      - numpy==2.4.6
      - pandas==3.0.5
      - scikit-learn==1.9.0
      - rdkit==2026.3.5
      - matplotlib==3.11.1
      - h5py==3.16.0
variables:
  KERAS_BACKEND: torch